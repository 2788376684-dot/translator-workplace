name: Inspect stage layout source
on:
  push:
    paths: ['.github/workflows/inspect-stage-layout.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print stage markup and render boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('译者决策工作台_公开双模式版/atelier-core.html').read_text()
          for term in ['id="stageCaption"','id="stageTitle"','id="stageSub"','stageCaption','stageTitle','段完成','当前项目','粘贴全文或直接输入']:
              indexes=[m.start() for m in re.finditer(re.escape(term),s)]
              print('\n===',term,'count=',len(indexes),'===')
              for pos in indexes[:5]:
                  print('OFFSET',pos)
                  print(s[max(0,pos-650):pos+1050].replace('\\n','\n')[:1800])
          PY
