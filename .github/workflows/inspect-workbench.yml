name: Inspect workbench UI functions
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/inspect-workbench.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect-workbench.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workbench-diagnostics.txt
          git commit -m "Record UI inspection anchors" && git push
