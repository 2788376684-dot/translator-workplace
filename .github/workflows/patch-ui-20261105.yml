name: Apply requested translator UI fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-ui-20261105.py'
      - '.github/workflows/patch-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch workbench
        run: python .github/scripts/patch-ui-20261105.py
      - name: JavaScript syntax and UI assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('译者决策工作台_公开双模式版')
          core=(root/'atelier-core.html').read_text()
          assert 'id="sentenceAskInput"' in core
          assert '标为疑问' in core
          assert '审校设置' in core
          assert 'reviewSetupOpen' in core
          assert 'tw-ui-fixes-20261105' in core
          start=core.index("<script>'use strict';(()=>")+len("<script>")
          end=core.index("</script>",start)
          Path('/tmp/review-ui-test.js').write_text(core[start:end])
          PY
          node --check /tmp/review-ui-test.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "译者决策工作台_公开双模式版/atelier-core.html"
          git diff --cached --quiet || (git commit -m "Improve inline review questions, final layout and export" && git push)
