name: Apply Atelier fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-atelier.yml'
      - '.github/scripts/fix-atelier.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch Atelier
        run: python .github/scripts/fix-atelier.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('译者决策工作台_公开双模式版/atelier.html').read_text()
          assert "function ensureDraftDirection" in s
          assert "DOMContentLoaded',boot" in s
          assert "id=\"week8-packed\"" in s
          script=s.split("<script>'use strict';(()=>",1)[1].split("</script>",1)[0]
          Path("/tmp/atelier-check.js").write_text("'use strict';(()=>"+script)
          PY
          node --check /tmp/atelier-check.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "译者决策工作台_公开双模式版/atelier.html"
          git diff --cached --quiet || (git commit -m "Fix Atelier translation direction and OCR loading" && git push)
