name: Inspect final export flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/inspect-export.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/export-diagnostics.txt
          git diff --cached --quiet || (git commit -m 'Record export UI code inspection' && git push)
