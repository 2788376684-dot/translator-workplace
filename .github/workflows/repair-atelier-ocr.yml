name: Repair Atelier OCR initialization
on:
  push:
    paths:
      - '.github/workflows/repair-atelier-ocr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch OCR and handoff code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('译者决策工作台_公开双模式版/atelier.html')
          text=p.read_text(encoding='utf-8')
          old="try{const txt=$('week8-packed').textContent.trim(),bytes="
          fixed="try{if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));if(!$('week8-packed'))throw new Error('OCR 数据模块缺失，请重新部署完整页面');if(!$('paramFrame')||proj().id!==target)return;const txt=$('week8-packed').textContent.trim(),bytes="
          if old in text:
              assert text.count(old)==1
              text=text.replace(old,fixed)
          elif fixed not in text:
              raise RuntimeError('OCR pattern not found')
          text=text.replace("window.open('./','_blank','noopener');toast('已发送到决策审校", "window.open('/index.html','_blank','noopener');toast('已发送到决策审校")
          assert 'id="week8-packed"' in text
          p.write_text(text,encoding='utf-8')
          PY
      - name: Run existing smoke tests
        run: node --test '译者决策工作台_公开双模式版/tests/smoke.cjs'
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '译者决策工作台_公开双模式版/atelier.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Atelier OCR initialization order'
            git push
          fi
