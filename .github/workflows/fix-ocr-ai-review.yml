name: Fix OCR parameter AI review
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-ocr-ai-review.py'
      - '.github/workflows/fix-ocr-ai-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted AI review repair
        run: python3 .github/scripts/fix-ocr-ai-review.py
      - name: Verify core JavaScript parses and repair is present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('译者决策工作台_公开双模式版/atelier-core.html')
          s=p.read_text(encoding='utf-8')
          assert 'function paramIssueHtml(s){' in s
          assert 'issueHtml(s)' not in s
          assert s.index("${!locked?panel('AI 审校表格',",s.index('function renderParamRevision(){')) < s.index("${paramEditorHtml('revision',locked)}",s.index('function renderParamRevision(){'))
          start=s.index("<script>'use strict';(()=>")+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/ocr-ai-review-syntax.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/ocr-ai-review-syntax.js
      - name: Commit repaired workbench
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "译者决策工作台_公开双模式版/atelier-core.html"
          git diff --cached --quiet || (git commit -m "Fix OCR parameter AI review and place controls above table" && git push)
