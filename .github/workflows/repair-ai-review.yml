name: Repair AI sentence review
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair-ai-review.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/repair-ai-review.py
      - name: Validate live workbench script
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('译者决策工作台_公开双模式版/atelier-core.html').read_text()
          start=s.index("<script>'use strict';(()=>")+len("<script>")
          Path('/tmp/core.js').write_text(s[start:s.index('</script>',start)])
          assert 'async function runReviewNow()' in s
          assert 'requestBatch' in s
          PY
          node --check /tmp/core.js
      - name: Save verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "译者决策工作台_公开双模式版/atelier-core.html"
          git diff --cached --quiet || (git commit -m "Repair sentence review execution with checked batches" && git push)
