  const names=[...new Set(source.strings.flatMap(row=>tokens(row.source)))];
  const vars=node('div','','variables');
  names.forEach(name=>{const label=node('label',name+' ');const input=node('input');input.value=variables[name]??(name==='name'?'林悦':'3');variables[name]=input.value;input.onchange=()=>{variables[name]=input.value;renderRuntime()};label.append(input);vars.append(label)});
  if(names.length)screen.append(vars);
  source.strings.forEach(row=>{
    const line=node('div','','generic'),value=fillMessage(row.id),control=row.context.control;
    let sample;
    if(/按钮|button/i.test(control)){sample=node('button',value);sample.disabled=true;}
    else if(/状态|status/i.test(control)){sample=node('span',value,'badge');}
    else if(/标题|title/i.test(control)){sample=node('strong',value);}
    else{sample=node('span',value);}
    line.append(node('small',row.id),sample);screen.append(line);
  });
}
function renderRuntime(){
  const screen=el('screen');screen.replaceChildren();document.querySelector('.brand').textContent=source.view?'Proofdesk':'字符串预览';el('runtime-lang').textContent=messages?source.targetLocale:source.sourceLocale;
  if(source.view)showQueue(screen);else showGeneric(screen);
  if(embedded)requestAnimationFrame(()=>parent.postMessage({channel:'proofdesk.height',height:document.documentElement.scrollHeight},'*'));
}
function installSource(next){
  source=next;messages=null;records=clone(source.view?.records??[]);detailId=null;variables=Object.create(null);renderRuntime();
}
function applyPack(pack,via){messages=readPack(pack,source);renderRuntime();runtimeNotice('已载入中文语言包'+(via?'，'+via:'')+'。');}
el('runtime-source').onchange=e=>{
  const k=e.target.value;if(!runtimeCases[k])return;
  installSource(normalizeSource(runtimeCases[k].source));runtimeNotice('已切换至 '+source.title+'，当前使用英文。');
};
el('runtime-en').onclick=()=>{messages=null;renderRuntime();runtimeNotice('已恢复英文。')};
el('runtime-source-file').onchange=guarded(async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const next=normalizeSource(await readFile(file),file.name.replace(/\.json$/i,''));installSource(next);
  let opt=el('runtime-source').querySelector('[value="custom"]');if(!opt){opt=node('option');opt.value='custom';el('runtime-source').append(opt)}opt.textContent=next.title;el('runtime-source').value='custom';runtimeNotice('已导入 '+next.title+'。');
},m=>runtimeNotice(m,true));
el('runtime-pack-file').onchange=guarded(async e=>{
  const file=e.target.files[0];e.target.value='';if(file)applyPack(await readFile(file),file.name);
},m=>runtimeNotice(m,true));
if(embedded)window.addEventListener('message',event=>{
  if(event.source!==parent||event.data?.channel!=='proofdesk.command')return;
  try{
    const {action,payload}=event.data;
    if(action==='source')installSource(normalizeSource(payload));
    else if(action==='pack')applyPack(payload,'编辑区试用');
    else if(action==='english'){messages=null;renderRuntime()}
  }catch(error){runtimeNotice(error.message,true)}
});
installSource(source);
if(embedded)parent.postMessage({channel:'proofdesk.ready'},'*');
</script></body></html>
