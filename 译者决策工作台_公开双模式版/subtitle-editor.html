<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕编辑器 · Transhelper</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#213347;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccd8e4;background:#fff;color:#274663;border-radius:9px;padding:9px 13px}button:hover{background:#eef5fc}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #377fca;outline-offset:1px}button.primary{background:#245b94;color:white;border-color:#245b94}header{height:66px;background:white;border-bottom:1px solid #e1e6ed;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:15px}h1{font-size:19px;margin:0}header a{color:#426783;text-decoration:none}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:white;padding:12px 24px;border-bottom:1px solid #e4eaf0}input[type=file]{display:none}.wrap{display:grid;grid-template-columns:minmax(290px,42%) minmax(390px,58%);height:calc(100vh - 126px);min-height:470px}.preview{padding:20px;border-right:1px solid #dae3ed;overflow:auto}video,audio{width:100%;max-height:45vh;background:#101821;border-radius:12px}video:not([src]),audio:not([src]){display:none}.placeholder{height:230px;border:1px dashed #bbcbd9;border-radius:12px;display:grid;place-items:center;color:#75869a;background:#fff}.player-info{font-size:13px;color:#607489;margin-top:12px}.timeline{margin-top:20px}.timeline input{width:100%}.editor{display:flex;flex-direction:column;min-height:0}.editor-head{padding:16px 20px;border-bottom:1px solid #dae3ed;display:flex;align-items:center;justify-content:space-between;gap:12px}.editor-head strong{font-size:15px}.cues{flex:1;overflow:auto;padding:10px 18px 20px}.cue{display:grid;grid-template-columns:64px 1fr;gap:10px;background:white;border:1px solid #dfe6ef;border-radius:12px;margin:9px 0;padding:14px}.cue.active{border-color:#3a78b7;box-shadow:0 0 0 1px #3a78b7}.num{font-size:13px;color:#667b90;padding-top:8px}.fields{display:grid;gap:9px}.times{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.times input{width:116px;padding:7px;border:1px solid #d1dce7;border-radius:7px}.fields label{font-size:12px;color:#62788c;display:block}.fields textarea{display:block;margin-top:4px;width:100%;min-height:57px;resize:vertical;padding:9px;border:1px solid #d1dce7;border-radius:8px;background:#fbfdff;line-height:1.55}.rowbtn{display:flex;gap:8px;flex-wrap:wrap}.rowbtn button{font-size:12px;padding:5px 9px}.status{margin-left:auto;color:#647b8c;font-size:12px}.empty{text-align:center;padding:65px 20px;color:#7a8998}footer{padding:9px 22px;background:white;border-top:1px solid #dfe6ef;color:#63798b;font-size:12px}@media(max-width:850px){header{padding:0 12px}.tools{padding:10px 12px}.wrap{display:block;height:auto}.preview{border-right:0;border-bottom:1px solid #dae3ed}.editor{height:70vh}.status{width:100%;margin-left:0}}
</style></head><body>
<header><div><h1>Transhelper · 字幕编辑器</h1></div><a href="/atelier.html">← 返回翻译工作台</a></header>
<div class="tools">
<button id="mediaBtn" class="primary">导入视频 / 音频</button><input id="media" type="file" accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mp3,.wav,.m4a">
<button id="subsBtn">导入 SRT / VTT</button><input id="subs" type="file" accept=".srt,.vtt,text/plain">
<button id="add">＋ 添加字幕</button><button id="exportSrt">导出 SRT</button><button id="exportVtt">导出 VTT</button><button id="backup">备份工程</button><button id="restoreBtn">恢复工程</button><input id="restore" type="file" accept=".json,application/json">
<button id="clear">清空内容</button><span class="status" id="status">已就绪</span>
</div>
<main class="wrap"><section class="preview"><div class="placeholder" id="placeholder">导入本地视频或音频后可直接播放</div><video id="video" controls playsinline preload="metadata"></video><audio id="audio" controls preload="metadata"></audio><div class="player-info" id="mediaInfo">媒体文件只在本机浏览器中使用，不上传服务器。</div><div class="timeline"><label for="seek">播放位置</label><input type="range" id="seek" min="0" max="1000" value="0"><div class="player-info" id="clock">00:00.000 / 00:00.000</div></div></section><section class="editor"><div class="editor-head"><strong>原文 / 译文对照</strong><span id="count">0 条字幕</span></div><div id="cues" class="cues"></div></section></main><footer>自动保存字幕文本和时间轴到本机浏览器。媒体文件受浏览器安全限制，刷新后需要重新选择；字幕与译文不会因此丢失。</footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='transhelper-standalone-subtitle-v1';let rows=[],active=-1,mediaURL=null,player=null,duration=0,dirtyTimer=null;
const setStatus=s=>$('status').textContent=s;
const fmt=n=>{n=Math.max(0,Number(n)||0);let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60),ms=Math.round((n-Math.floor(n))*1000);return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(ms).padStart(3,'0')};
const parseTime=s=>{let match=String(s||'').trim().replace(',','.').match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?$/);if(!match)return NaN;return (+(match[1]||0))*3600+(+match[2])*60+(+match[3])+(+(match[4]||0).padEnd(3,'0'))/1000};
const clean=r=>({start:Math.max(0,Number(r.start)||0),end:Math.max(0,Number(r.end)||0),source:String(r.source||''),target:String(r.target||'')});
function save(){try{localStorage.setItem(key,JSON.stringify(rows));setStatus('本地已保存')}catch(e){setStatus('本地空间不足，请导出工程备份')}}
function schedule(){clearTimeout(dirtyTimer);dirtyTimer=setTimeout(save,250)}
function parseSub(text){let blocks=text.replace(/^\uFEFF/,'').replace(/\r/g,'').replace(/^WEBVTT[^\n]*\n/,'').trim().split(/\n\s*\n/),found=[];for(let b of blocks){let lines=b.split('\n'),at=lines.findIndex(s=>s.includes('-->'));if(at<0)continue;let ts=lines[at].split('-->'),a=parseTime(ts[0]),z=parseTime(ts[1].trim().split(/\s/)[0]);if(!Number.isFinite(a)||!Number.isFinite(z))continue;let payload=lines.slice(at+1).join('\n').trim();found.push(clean({start:a,end:z,source:payload,target:''}))}return found}
function emit(ext){let t=rows.map((r,i)=>{let start=fmt(r.start).replace('.',ext==='srt'?',':'.'),end=fmt(r.end).replace('.',ext==='srt'?',':'.');return (ext==='srt'?i+1+'\n':'')+start+' --> '+end+'\n'+(r.target.trim()||r.source.trim())}).join('\n\n');return ext==='vtt'?'WEBVTT\n\n'+t+'\n':t+'\n'}
function download(content,name,type='text/plain'){let blob=new Blob([content],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function render(focus=false){let el=$('cues');el.replaceChildren();$('count').textContent=rows.length+' 条字幕';if(!rows.length){let p=document.createElement('div');p.className='empty';p.textContent='暂无字幕。导入 SRT / VTT，或添加第一条字幕。';el.appendChild(p);return}
rows.forEach((r,i)=>{let card=document.createElement('article');card.className='cue'+(i===active?' active':'');card.dataset.index=i;let label=document.createElement('div');label.className='num';label.textContent=String(i+1).padStart(2,'0');let fields=document.createElement('div');fields.className='fields';let times=document.createElement('div');times.className='times';for(const prop of ['start','end']){let input=document.createElement('input');input.value=fmt(r[prop]);input.title=prop==='start'?'开始时间':'结束时间';input.setAttribute('aria-label',prop==='start'?'开始时间':'结束时间');input.addEventListener('change',()=>{let t=parseTime(input.value);if(!Number.isFinite(t)){input.value=fmt(r[prop]);setStatus('时间格式错误，应为 00:00:00.000');return}r[prop]=t;if(r.end<r.start)r.end=r.start;input.value=fmt(r[prop]);schedule();render()});times.appendChild(input);if(prop==='start'){let sep=document.createElement('span');sep.textContent='—';times.appendChild(sep)}}fields.appendChild(times);
for(const prop of ['source','target']){let label=document.createElement('label');label.textContent=prop==='source'?'原文':'译文';let area=document.createElement('textarea');area.value=r[prop];area.rows=2;area.setAttribute('aria-label',(prop==='source'?'原文':'译文')+(i+1));area.addEventListener('input',()=>{r[prop]=area.value;schedule()});area.addEventListener('focus',()=>{active=i;document.querySelectorAll('.cue').forEach(e=>e.classList.toggle('active',+e.dataset.index===i))});label.appendChild(area);fields.appendChild(label)}
let actions=document.createElement('div');actions.className='rowbtn';const btn=(text,fn)=>{let b=document.createElement('button');b.textContent=text;b.type='button';b.onclick=fn;actions.appendChild(b)};
btn('定位播放',()=>{active=i;if(player){player.currentTime=r.start;player.play().catch(()=>{})}render()});btn('按播放位置设起点',()=>{if(!player)return;r.start=player.currentTime;r.end=Math.max(r.end,r.start);schedule();render()});btn('按播放位置设终点',()=>{if(!player)return;r.end=Math.max(r.start,player.currentTime);schedule();render()});btn('删除',()=>{rows.splice(i,1);active=Math.min(active,rows.length-1);schedule();render()});fields.appendChild(actions);card.append(label,fields);el.appendChild(card)});if(focus&&active>=0)el.querySelector('.cue.active')?.scrollIntoView({block:'nearest'})}
function bindMedia(file){if(!file)return;if(mediaURL)URL.revokeObjectURL(mediaURL);mediaURL=URL.createObjectURL(file);const isAudio=file.type.startsWith('audio/')||/\.(mp3|wav|m4a|aac|ogg)$/i.test(file.name);$('video').removeAttribute('src');$('audio').removeAttribute('src');$('video').style.display=isAudio?'none':'block';$('audio').style.display=isAudio?'block':'none';player=isAudio?$('audio'):$('video');player.src=mediaURL;player.load();$('placeholder').hidden=true;$('mediaInfo').textContent=file.name+' · 本地媒体';setStatus('媒体已载入，点击播放');player.onloadedmetadata=()=>{duration=Number.isFinite(player.duration)?player.duration:0;updateClock();setStatus('媒体已就绪')};player.onerror=()=>setStatus('播放失败：可能是 Safari 不支持该文件编码，请尝试 H.264 MP4 或 MP3');player.ontimeupdate=updateClock;player.ondurationchange=updateClock}
function updateClock(){if(!player)return;let current=player.currentTime||0;duration=Number.isFinite(player.duration)?player.duration:duration;$('clock').textContent=fmt(current)+' / '+fmt(duration);$('seek').value=duration?Math.min(1000,Math.round(current/duration*1000)):0;let n=rows.findIndex(r=>current>=r.start&&current<r.end);if(n!==-1&&n!==active){active=n;document.querySelectorAll('.cue').forEach(e=>e.classList.toggle('active',+e.dataset.index===n))}}
$('seek').oninput=()=>{if(player&&duration)player.currentTime=(+$('seek').value)/1000*duration};
$('mediaBtn').onclick=()=>$('media').click();$('media').onchange=e=>bindMedia(e.target.files[0]);
$('subsBtn').onclick=()=>$('subs').click();$('subs').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=parseSub(await f.text());if(!parsed.length)throw Error('未找到有效时间轴');if(rows.length&&!confirm('导入字幕将覆盖当前字幕文本，继续？'))return;rows=parsed;active=0;save();render();setStatus('已导入 '+rows.length+' 条字幕')}catch(err){setStatus('字幕导入失败：'+err.message)}e.target.value=''};
$('add').onclick=()=>{let start=player?player.currentTime:rows.length?rows[rows.length-1].end:0;rows.push(clean({start,end:start+2,source:'',target:''}));active=rows.length-1;save();render(true)};
$('exportSrt').onclick=()=>download(emit('srt'),'transhelper-subtitles.srt');$('exportVtt').onclick=()=>download(emit('vtt'),'transhelper-subtitles.vtt');$('backup').onclick=()=>download(JSON.stringify({format:'transhelper-subtitle-v1',cues:rows},null,2),'transhelper-subtitles.json','application/json');
$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.cues))throw Error('文件缺少字幕记录');if(rows.length&&!confirm('恢复备份将覆盖当前字幕文本，继续？'))return;rows=x.cues.map(clean);save();render();setStatus('已恢复 '+rows.length+' 条字幕')}catch(err){setStatus('备份读取失败：'+err.message)}e.target.value=''};
$('clear').onclick=()=>{if(!confirm('清空全部字幕及本地保存的内容？媒体连接也将解除，此操作不可撤销。'))return;rows=[];active=-1;if(player){player.pause();player.removeAttribute('src');player.load()}if(mediaURL)URL.revokeObjectURL(mediaURL);mediaURL=null;player=null;$('placeholder').hidden=false;$('video').style.display='none';$('audio').style.display='none';$('mediaInfo').textContent='媒体文件只在本机浏览器中使用，不上传服务器。';save();render();setStatus('已清空')};
try{let restored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(restored))rows=restored.map(clean)}catch(e){setStatus('读取本地字幕失败，可导入备份恢复')}render();
})();
</script></body></html>
