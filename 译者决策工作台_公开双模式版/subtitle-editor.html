<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕编辑器 · Transhelper</title>
<style>

</style></head><body>
<header><div><h1>Transhelper · 字幕编辑器</h1></div><a href="/atelier.html">← 返回翻译工作台</a></header>
<div class="tools">
<button id="mediaBtn" class="primary">导入视频 / 音频</button><input id="media" type="file" accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mp3,.wav,.m4a">
<button id="subsBtn">导入 SRT / VTT</button><input id="subs" type="file" accept=".srt,.vtt,text/plain">
<select id="speechLanguage" title="原文语音语言" aria-label="原文语音语言"><option value="">自动检测语言</option><option value="english">英语语音</option><option value="chinese">中文语音</option><option value="japanese">日语语音</option><option value="french">法语语音</option><option value="german">德语语音</option></select><select id="targetLanguage" title="字幕翻译方向" aria-label="字幕翻译方向"><option value="zh-CN">译为中文</option><option value="en">译为英文</option><option value="ja">译为日文</option><option value="fr">译为法文</option></select><button id="recognize">自动识别原文与出入点</button><button id="translateAI" class="primary">AI 翻译字幕</button><button id="autoAll" class="primary">一键识别并翻译</button><button id="cancelAI" hidden>取消任务</button><button id="add">＋ 添加字幕</button><div class="export-controls"><label for="exportMode">字幕内容</label><select id="exportMode" aria-label="选择导出字幕内容"><option value="target">仅译文</option><option value="source">仅原文</option><option value="both">双语（原文在上）</option></select><button id="exportSrt">导出 SRT</button><button id="exportVtt">导出 VTT</button><button id="exportVideo">导出带字幕视频</button><button id="stopVideoExport" hidden>停止导出</button></div><button id="backup">备份工程</button><button id="restoreBtn">恢复工程</button><input id="restore" type="file" accept=".json,application/json">
<button id="clear">清空内容</button><span class="status" id="status">已就绪</span>
</div>
<main class="wrap"><section class="preview"><div class="placeholder" id="placeholder">导入本地视频或音频后可直接播放</div><div class="media-stage" id="mediaStage"><button type="button" class="fullscreen-stage-button" id="stageFullscreen" title="视频与字幕一起全屏">⛶ 字幕全屏</button><video id="video" controls playsinline preload="metadata"></video><div class="subtitle-overlay" id="subtitleOverlay" aria-live="off" hidden><div class="subtitle-line" id="subtitleFirst"></div><div class="subtitle-line secondary" id="subtitleSecond"></div></div></div><audio id="audio" controls preload="metadata"></audio><div id="audioCaption" class="audio-caption" hidden><div class="subtitle-overlay"><div class="subtitle-line" id="audioFirst"></div><div class="subtitle-line secondary" id="audioSecond"></div></div></div><div class="preview-mode"><label for="previewMode">字幕预览</label><select id="previewMode"><option value="both">双语（原文在上）</option><option value="source">仅原文</option><option value="target">仅译文</option></select><span id="previewHint">播放或拖动进度条即可预览</span></div><div class="subtitle-settings" aria-label="字幕显示设置"><label for="captionSize">字号 <input id="captionSize" type="range" min="12" max="32" step="1" value="16"><output id="captionSizeValue" for="captionSize">16 px</output></label><label for="captionPosition">距底部 <input id="captionPosition" type="range" min="4" max="45" step="1" value="9"><output id="captionPositionValue" for="captionPosition">9%</output></label><button type="button" id="resetCaptionStyle">恢复默认</button></div><div class="player-info" id="mediaInfo">媒体文件只在本机浏览器中使用，不上传服务器。</div><div class="timeline"><label for="seek">播放位置</label><input type="range" id="seek" min="0" max="1000" value="0"><div class="player-info" id="clock">00:00.000 / 00:00.000</div></div></section><section class="editor"><div class="editor-head"><strong>原文 / 译文对照</strong><span id="count">0 条字幕</span></div><div id="cues" class="cues"></div></section></main><footer>自动保存字幕文本和时间轴到本机浏览器。媒体文件受浏览器安全限制，刷新后需要重新选择；字幕与译文不会因此丢失。</footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='transhelper-standalone-subtitle-v1';let rows=[],active=-1,mediaURL=null,player=null,duration=0,dirtyTimer=null;
const setStatus=s=>$('status').textContent=s;
const fmt=n=>{n=Math.max(0,Number(n)||0);let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60),ms=Math.round((n-Math.floor(n))*1000);return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(ms).padStart(3,'0')};
const parseTime=s=>{let match=String(s||'').trim().replace(',','.').match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?$/);if(!match)return NaN;return (+(match[1]||0))*3600+(+match[2])*60+(+match[3])+Number(String(match[4]||'0').padEnd(3,'0'))/1000};
const clean=r=>({start:Math.max(0,Number(r.start)||0),end:Math.max(0,Number(r.end)||0),source:String(r.source||''),target:String(r.target||'')});
function save(){updateSubtitlePreview();try{localStorage.setItem(key,JSON.stringify(rows));setStatus('本地已保存')}catch(e){setStatus('本地空间不足，请导出工程备份')}}
function schedule(){clearTimeout(dirtyTimer);dirtyTimer=setTimeout(save,250)}
function parseSub(text){let blocks=text.replace(/^\uFEFF/,'').replace(/\r/g,'').replace(/^WEBVTT[^\n]*\n/,'').trim().split(/\n\s*\n/),found=[];for(let b of blocks){let lines=b.split('\n'),at=lines.findIndex(s=>s.includes('-->'));if(at<0)continue;let ts=lines[at].split('-->'),a=parseTime(ts[0]),z=parseTime(ts[1].trim().split(/\s/)[0]);if(!Number.isFinite(a)||!Number.isFinite(z))continue;let payload=lines.slice(at+1).join('\n').trim();found.push(clean({start:a,end:z,source:payload,target:''}))}return found}
function exportText(r,mode){
 const source=String(r.source||'').trim(),target=String(r.target||'').trim();
 if(mode==='source')return source;
 if(mode==='target')return target;
 return [source,target].filter(Boolean).join('\n');
}
function emit(ext,mode=$('exportMode').value){
 let t=rows.map((r,i)=>{
  let start=fmt(r.start).replace('.',ext==='srt'?',':'.'),end=fmt(r.end).replace('.',ext==='srt'?',':'.');
  return (ext==='srt'?i+1+'\n':'')+start+' --> '+end+'\n'+exportText(r,mode);
 }).join('\n\n');
 return ext==='vtt'?'WEBVTT\n\n'+t+'\n':t+'\n';
}
function download(content,name,type='text/plain'){let blob=new Blob([content],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function render(focus=false){updateSubtitlePreview();let el=$('cues');el.replaceChildren();$('count').textContent=rows.length+' 条字幕';if(!rows.length){let p=document.createElement('div');p.className='empty';p.textContent='暂无字幕。导入 SRT / VTT，或添加第一条字幕。';el.appendChild(p);return}
rows.forEach((r,i)=>{let card=document.createElement('article');card.className='cue'+(i===active?' active':'');card.dataset.index=i;let label=document.createElement('div');label.className='num';label.textContent=String(i+1).padStart(2,'0');let fields=document.createElement('div');fields.className='fields';let times=document.createElement('div');times.className='times';for(const prop of ['start','end']){let input=document.createElement('input');input.value=fmt(r[prop]);input.title=prop==='start'?'开始时间':'结束时间';input.setAttribute('aria-label',prop==='start'?'开始时间':'结束时间');input.addEventListener('change',()=>{let t=parseTime(input.value);if(!Number.isFinite(t)){input.value=fmt(r[prop]);setStatus('时间格式错误，应为 00:00:00.000');return}r[prop]=t;if(r.end<r.start)r.end=r.start;input.value=fmt(r[prop]);schedule();render()});times.appendChild(input);if(prop==='start'){let sep=document.createElement('span');sep.textContent='—';times.appendChild(sep)}}fields.appendChild(times);
for(const prop of ['source','target']){let label=document.createElement('label');label.textContent=prop==='source'?'原文':'译文';let area=document.createElement('textarea');area.value=r[prop];area.rows=2;area.setAttribute('aria-label',(prop==='source'?'原文':'译文')+(i+1));area.addEventListener('input',()=>{r[prop]=area.value;schedule();updateSubtitlePreview()});area.addEventListener('focus',()=>{active=i;document.querySelectorAll('.cue').forEach(e=>e.classList.toggle('active',+e.dataset.index===i))});label.appendChild(area);fields.appendChild(label)}
let actions=document.createElement('div');actions.className='rowbtn';const btn=(text,fn)=>{let b=document.createElement('button');b.textContent=text;b.type='button';b.onclick=fn;actions.appendChild(b)};
btn('定位播放',()=>{active=i;if(player){player.currentTime=r.start;player.play().catch(()=>{})}render()});btn('按播放位置设起点',()=>{if(!player)return;r.start=player.currentTime;r.end=Math.max(r.end,r.start);schedule();render()});btn('按播放位置设终点',()=>{if(!player)return;r.end=Math.max(r.start,player.currentTime);schedule();render()});btn('拆分字幕',()=>splitCue(i));btn('删除',()=>{rows.splice(i,1);active=Math.min(active,rows.length-1);schedule();render()});fields.appendChild(actions);card.append(label,fields);el.appendChild(card)});if(focus&&active>=0)el.querySelector('.cue.active')?.scrollIntoView({block:'nearest'})}

function splitTextAt(text,ratio){
 const raw=String(text||'').trim();
 if(!raw)return ['',''];
 if(raw.length<2)return [raw,''];
 let desired=Math.min(raw.length-1,Math.max(1,Math.round(raw.length*ratio)));
 const candidates=[];
 for(let i=1;i<raw.length;i++){
  const prev=raw[i-1],next=raw[i];
  if(/[.!?。！？；;，,、：:]/.test(prev)||(/\s/.test(next)&&!(/\s/.test(prev))))candidates.push(i);
 }
 const nearest=candidates.sort((a,b)=>Math.abs(a-desired)-Math.abs(b-desired))[0];
 const index=nearest!==undefined&&Math.abs(nearest-desired)<raw.length*.28?nearest:desired;
 return [raw.slice(0,index).trim(),raw.slice(index).trim()];
}
function splitCue(i){
 const r=rows[i];if(!r)return;
 const span=r.end-r.start;
 if(!(span>.12)){setStatus('当前时间段太短，请先调整入点与出点');return;}
 const card=document.querySelectorAll('.cue')[i];
 const focused=document.activeElement;
 let prop=null,cut=null;
 const editors=card?.querySelectorAll('textarea');
 if(focused===editors?.[0]||focused===editors?.[1]){
  prop=focused===editors[0]?'source':'target';
  const selection=focused.selectionStart;
  if(selection>0&&selection<focused.value.length)cut=selection;
 }
 const reference=prop?String(r[prop]||''):String(r.source||r.target||'');
 if(reference.trim().length<2){setStatus('请先填写字幕文本，再进行拆分');return;}
 let ratio=cut===null?.5:Math.max(.12,Math.min(.88,cut/Math.max(1,reference.length)));
 let src=splitTextAt(r.source,ratio),tgt=splitTextAt(r.target,ratio);
 if(prop&&cut!==null){
  const exact=String(r[prop]||'');
  const parts=[exact.slice(0,cut).trim(),exact.slice(cut).trim()];
  if(prop==='source')src=parts;else tgt=parts;
 }
 if(!((src[0]||tgt[0])&&(src[1]||tgt[1]))){setStatus('无法将字幕拆成两段，请将光标放在合适位置后再点拆分');return;}
 const splitAt=Math.max(r.start+.05,Math.min(r.end-.05,r.start+span*ratio));
 rows.splice(i,1,clean({start:r.start,end:splitAt,source:src[0],target:tgt[0]}),clean({start:splitAt,end:r.end,source:src[1],target:tgt[1]}));
 active=i;save();render(true);setStatus('字幕已拆分为两条；请校对两段原文、译文及时间点');
}
function updateSubtitlePreview(){
 const mode=$('previewMode')?.value||'both';
 const current=player?Number(player.currentTime)||0:0;
 const cue=rows.find(r=>current>=r.start&&current<r.end);
 let first='',second='';
 if(cue){
  first=mode==='target'?cue.target:cue.source;
  second=mode==='both'?cue.target:'';
 }
 for(const prefix of ['subtitle','audio']){
  const a=$(prefix==='subtitle'?'subtitleFirst':'audioFirst');
  const b=$(prefix==='subtitle'?'subtitleSecond':'audioSecond');
  if(a){a.textContent=first;a.hidden=!first;}
  if(b){b.textContent=second;b.hidden=!second;}
 }
 if($('subtitleOverlay'))$('subtitleOverlay').hidden=!first&&!second;
 if($('audioCaption'))$('audioCaption').hidden=!player||player!==$('audio');
}
$('previewMode').addEventListener('change',e=>{try{localStorage.setItem('transhelper-subtitle-preview-mode',e.target.value)}catch(_){}updateSubtitlePreview()});
try{$('previewMode').value=localStorage.getItem('transhelper-subtitle-preview-mode')||'both'}catch(_){}
function bindMedia(file){if(!file)return;if(mediaURL)URL.revokeObjectURL(mediaURL);mediaURL=URL.createObjectURL(file);const isAudio=file.type.startsWith('audio/')||/\.(mp3|wav|m4a|aac|ogg)$/i.test(file.name);$('video').removeAttribute('src');$('audio').removeAttribute('src');$('video').style.display=isAudio?'none':'block';$('audio').style.display=isAudio?'block':'none';player=isAudio?$('audio'):$('video');player.src=mediaURL;player.load();$('placeholder').hidden=true;$('mediaInfo').textContent=file.name+' · 本地媒体';setStatus('媒体已载入，点击播放');player.onloadedmetadata=()=>{duration=Number.isFinite(player.duration)?player.duration:0;updateClock();setStatus('媒体已就绪')};player.onerror=()=>setStatus('播放失败：可能是 Safari 不支持该文件编码，请尝试 H.264 MP4 或 MP3');player.ontimeupdate=updateClock;player.ondurationchange=updateClock;player.onseeked=updateSubtitlePreview;updateSubtitlePreview()}
function updateClock(){if(!player)return;updateSubtitlePreview();let current=player.currentTime||0;duration=Number.isFinite(player.duration)?player.duration:duration;$('clock').textContent=fmt(current)+' / '+fmt(duration);$('seek').value=duration?Math.min(1000,Math.round(current/duration*1000)):0;let n=rows.findIndex(r=>current>=r.start&&current<r.end);if(n!==-1&&n!==active){active=n;document.querySelectorAll('.cue').forEach(e=>e.classList.toggle('active',+e.dataset.index===n))}}
$('seek').oninput=()=>{if(player&&duration)player.currentTime=(+$('seek').value)/1000*duration};
$('mediaBtn').onclick=()=>$('media').click();$('media').onchange=e=>bindMedia(e.target.files[0]);
$('subsBtn').onclick=()=>$('subs').click();$('subs').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=parseSub(await f.text());if(!parsed.length)throw Error('未找到有效时间轴');if(rows.length&&!confirm('导入字幕将覆盖当前字幕文本，继续？'))return;rows=parsed;active=0;save();render();setStatus('已导入 '+rows.length+' 条字幕')}catch(err){setStatus('字幕导入失败：'+err.message)}e.target.value=''};
$('add').onclick=()=>{let start=player?player.currentTime:rows.length?rows[rows.length-1].end:0;rows.push(clean({start,end:start+2,source:'',target:''}));active=rows.length-1;save();render(true)};
$('exportSrt').onclick=()=>{if(!rows.length)return setStatus('尚无字幕可导出');const mode=$('exportMode').value;download(emit('srt',mode),'transhelper-'+mode+'.srt')};$('exportVtt').onclick=()=>{if(!rows.length)return setStatus('尚无字幕可导出');const mode=$('exportMode').value;download(emit('vtt',mode),'transhelper-'+mode+'.vtt')};$('backup').onclick=()=>download(JSON.stringify({format:'transhelper-subtitle-v1',cues:rows},null,2),'transhelper-subtitles.json','application/json');

/* Export a caption-burned video locally when the browser supports canvas recording.

let currentVideoExport=null;
function canvasLines(ctx,text,maxWidth){
 const paragraphs=String(text||'').split('\n'),lines=[];
 for(const paragraph of paragraphs){
  let line='';
  const isCJK=/[\u3400-\u9fff]/.test(paragraph);
  const units=isCJK?Array.from(paragraph):paragraph.split(/(\s+)/);
  for(const unit of units){
   if(ctx.measureText(line+unit).width>maxWidth&&line){lines.push(line.trim());line=unit.trimStart();}
   else line+=unit;
  }
  if(line.trim())lines.push(line.trim());
 }
 return lines;
}
function drawExportCaption(ctx,w,h,current,items,mode,display){
 const cue=items.find(r=>current>=r.start&&current<r.end);
 if(!cue)return;
 const parts=mode==='both'?[cue.source,cue.target]:[mode==='source'?cue.source:cue.target];
 const base=display.size*Math.max(1,w/720),maxWidth=w*.9;
 const prepared=[];
 for(let i=0;i<parts.length;i++){
  const text=String(parts[i]||'').trim();if(!text)continue;
  const font=base*(mode==='both'&&i===1?.93:1);
  ctx.font='600 '+font+'px -apple-system,Arial,"PingFang SC",sans-serif';
  for(const line of canvasLines(ctx,text,maxWidth-28))prepared.push({line,font});
 }
 if(!prepared.length)return;
 let lineHeight=base*1.46,total=prepared.length*lineHeight;
 let bottom=h*display.position/100;
 let y=Math.max(lineHeight,h-bottom-total+lineHeight*.12);
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const row of prepared){
  ctx.font='600 '+row.font+'px -apple-system,Arial,"PingFang SC",sans-serif';
  const width=Math.min(maxWidth,ctx.measureText(row.line).width+22);
  ctx.fillStyle='rgba(0,0,0,.56)';ctx.fillRect((w-width)/2,y-lineHeight*.48,width,lineHeight*.96);
  ctx.lineWidth=Math.max(2,row.font*.17);ctx.strokeStyle='#000';
  ctx.strokeText(row.line,w/2,y);ctx.fillStyle='#fff';ctx.fillText(row.line,w/2,y);
  y+=lineHeight;
 }
}
async function exportBurnedVideo(){

 try{
  await new Promise((resolve,reject)=>{
   source.onloadedmetadata=resolve;source.onerror=()=>reject(Error('视频无法解码，请尝试 H.264/AAC MP4'));source.load();
  });
  if(job.cancelled)return;
  if(!Number.isFinite(source.duration)||source.duration<=0||source.duration>1200)throw Error('视频时长需在20分钟以内，请分段导出');
  canvas.width=Math.min(1920,source.videoWidth||1280);canvas.height=Math.max(2,Math.round(canvas.width*(source.videoHeight||720)/(source.videoWidth||1280)));

  });

  const items=rows.map(r=>({...r}));

   if(job.cancelled)return;

  setStatus('带字幕视频已生成：'+ext.toUpperCase()+' 格式，字幕已嵌入画面');
 }catch(error){setStatus('视频导出失败：'+error.message)}

}

<script>
/* ASR and translation are optional enhancements, separate from local editing.
   Never replace existing cues until a recognition result has been validated. */
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let busy=false,token=0,worker=null;
const status=s=>{$('status').textContent=s;};
function setBusy(v){
 busy=v;for(const id of ['recognize','translateAI','autoAll'])$(id).disabled=v;
 $('cancelAI').hidden=!v;
}
function snapshot(){return [...document.querySelectorAll('.cue')].map(el=>{const inputs=el.querySelectorAll('.times input');const text=el.querySelectorAll('textarea');return {start:seconds(inputs[0]?.value),end:seconds(inputs[1]?.value),source:text[0]?.value||'',target:text[1]?.value||''}})}
function seconds(value){const m=String(value||'').match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?$/);return m?Number(m[1]||0)*3600+Number(m[2])*60+Number(m[3])+Number(String(m[4]||'0').padEnd(3,'0'))/1000:0}
function timestamp(n){n=Math.max(0,Number(n)||0);const h=Math.floor(n/3600),m=Math.floor(n%3600/60),sec=Math.floor(n%60),ms=Math.floor((n-Math.floor(n))*1000);return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(ms).padStart(3,'0')}
function editCue(i,prop,value){
 const card=document.querySelectorAll('.cue')[i];if(!card)return;
 const inputs=card.querySelectorAll('.times input'),texts=card.querySelectorAll('textarea');
 const element=prop==='start'?inputs[0]:prop==='end'?inputs[1]:prop==='source'?texts[0]:texts[1];
 if(!element)return;
 const proto=element.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;
 const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;setter?.call(element,prop==='start'||prop==='end'?timestamp(value):value);
 element.dispatchEvent(new Event(prop==='start'||prop==='end'?'change':'input',{bubbles:true}));
}
async function decodeAudio(file,job){
 const Context=window.AudioContext||window.webkitAudioContext;
 if(!Context)throw Error('此浏览器不支持 Web Audio 音频解码');
 status('正在提取音频…');
 const bytes=await file.arrayBuffer();
 if(job!==token)throw Error('已取消');
 const ctx=new Context();
 try{
  let sound;
  try{sound=await ctx.decodeAudioData(bytes)}catch(e){throw Error('Safari 无法解码此媒体文件的音轨，请转为 AAC 编码 MP4、M4A、WAV 或 MP3')}
  if(job!==token)throw Error('已取消');
  if(sound.duration>1200)throw Error('当前本地识别支持最长20分钟音频，请分段处理');
  if(sound.duration<=0)throw Error('媒体中没有可读取的音频');
  const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!Offline)throw Error('此浏览器不支持离线音频处理');const offline=new Offline(1,Math.ceil(sound.duration*16000),16000);
  const node=offline.createBufferSource();node.buffer=sound;node.connect(offline.destination);node.start();
  return (await offline.startRendering()).getChannelData(0).slice();
 }finally{ctx.close().catch(()=>{});}
}
async function recognize(job){
 const file=$('media').files[0];
 if(!file)throw Error('请先在当前页面选择本地音视频文件');
 const existing=snapshot();
 if(existing.some(r=>r.source.trim()||r.target.trim())&&!confirm('重新识别将覆盖现有字幕及时间轴。建议先导出工程备份。继续吗？'))throw Error('已取消识别');
 const samples=await decodeAudio(file,job);
 if(job!==token)throw Error('已取消');
 status('正在加载本地语音识别模型…首次运行需要从网络下载模型');
 const result=await new Promise((resolve,reject)=>{
  worker=new Worker('/subtitle-asr-worker.js',{type:'module'});
  worker.onmessage=e=>{const data=e.data;if(data.type==='progress')status(data.message);if(data.type==='result')resolve(data.result);if(data.type==='error')reject(Error(data.message||'识别失败'));};
  worker.onerror=()=>reject(Error('语音识别模型加载失败，请检查网络连接，或导入 SRT/VTT 字幕'));
  worker.postMessage({audio:samples,language:$('speechLanguage').value},[samples.buffer]);
 });
 if(job!==token)throw Error('已取消');
 if(!Array.isArray(result?.chunks)||!result.chunks.length)throw Error('识别未返回带时间戳的字幕');
 let final=[],previous=0;
 for(const part of result.chunks){
  if(!part.text?.trim())continue;
  const [start,end]=part.timestamp||[];
  if(!Number.isFinite(start))throw Error('语音识别返回无效时间点');
  const a=Math.max(0,Number(start)),b=end===null?Math.max(a+1,Number(result.duration)||a+2):Number(end);
  if(!Number.isFinite(b)||b<=a)continue;
  final.push({start:Math.max(previous,a),end:b,source:part.text.trim(),target:''});previous=b;
 }
 final=final.filter(r=>r.end>r.start);
 if(!final.length)throw Error('语音模型未生成有效的字幕区间');if(final.length>500)throw Error('识别生成超过500条字幕，请分段处理');
 if(job!==token)throw Error('已取消');
 const frame=document.querySelector('#cues'),oldCount=frame.querySelectorAll('.cue').length;
 // Use the editor's existing Add and Delete operations, so its save and export remain authoritative.
 for(let i=oldCount-1;i>=0;i--){frame.querySelectorAll('.cue')[i]?.querySelector('.rowbtn button:last-child')?.click();}
 for(let i=0;i<final.length;i++){
  $('add').click();
  editCue(i,'start',final[i].start);editCue(i,'end',final[i].end);editCue(i,'source',final[i].source);
 }
 status('已识别 '+final.length+' 条字幕和对应出入点；请人工复核');

}
function parseJSON(content){
 let trimmed=content.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\x60\x60\x60\s*$/,'');
 let match=trimmed.match(/\{[\s\S]*\}/);

}
async function aiBatch(batch,lang,job){
 const messages=[
  {role:'system',content:'你是一名专业影视字幕译者。翻译每条原文字幕，语言自然、准确、简洁，保持说话者语气和术语一致。保留每个字幕的编号，严格返回纯 JSON 对象，格式为 {"translations":[{"id":0,"text":"译文"}]}。每个输入 id 恰有一条对应翻译。不要加入旁白、解释、时间轴或额外字段。不得合并或遗漏字幕。'},
  {role:'user',content:'目标语言：'+lang+'。请依次翻译下面的字幕原文，保证 id 原样返回：\n'+JSON.stringify(batch)}
 ];
 const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'default',messages})});
 const data=await response.json().catch(()=>({}));
 if(job!==token)throw Error('已取消');
 if(!response.ok)throw Error(data.error||'AI 接口请求失败（HTTP '+response.status+'）');
 const result=parseJSON(data.content||'');
 if(!Array.isArray(result.translations))throw Error('AI 没有返回有效字幕译文');
 const mapping=new Map();
 for(const t of result.translations){if(Number.isInteger(t.id)&&typeof t.text==='string'&&t.text.trim())mapping.set(t.id,t.text.trim());}
 if(batch.some(x=>!mapping.has(x.id)))throw Error('AI 遗漏了一些字幕，未将这一批译文写入');
 return mapping;
}
async function translate(job){
 const original=snapshot(),untranslated=original.map((r,id)=>({id,text:r.source.trim()})).filter(r=>r.text);
 if(!untranslated.length)throw Error('当前没有原文字幕。请先识别音视频或导入 SRT/VTT');
 const target={ 'zh-CN':'简体中文',en:'英语',ja:'日语',fr:'法语' }[$('targetLanguage').value]||'简体中文';
 let done=0;
 for(let i=0;i<untranslated.length;i+=10){
  if(job!==token)throw Error('已取消');
  const group=untranslated.slice(i,i+10);
  status('AI 翻译字幕中：'+done+'/'+untranslated.length);
  const mapping=await aiBatch(group,target,job);
  const now=snapshot();
  for(const item of group)if(now[item.id]?.source.trim()!==item.text)throw Error('翻译期间原文已被修改，已停止自动写入以防覆盖');
  for(const item of group)editCue(item.id,'target',mapping.get(item.id));
  done+=group.length;status('AI 翻译字幕中：'+done+'/'+untranslated.length);
 }
 status('已完成 '+done+' 条字幕翻译。出入点与原文一一对应，请人工校对');
}
async function task(kind){
 if(busy)return;const job=++token;setBusy(true);
 try{
  if(kind==='recognize'||kind==='all')await recognize(job);
  if(job===token&&(kind==='translate'||kind==='all'))await translate(job);
 }catch(e){if(job===token)status('操作未完成：'+e.message)}
 finally{if(worker){worker.terminate();worker=null}if(job===token)setBusy(false)}
}
$('recognize').onclick=()=>task('recognize');$('translateAI').onclick=()=>task('translate');$('autoAll').onclick=()=>task('all');
$('cancelAI').onclick=()=>{token++;worker?.terminate();worker=null;setBusy(false);status('已取消。已生成的内容保留，可继续编辑或备份。')};
})();
