<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Translator Workplace · Atelier</title>
<style>html,body{height:100%;margin:0;overflow:hidden;background:#f8f9fb}#app{display:block;width:100%;height:100%;border:0;visibility:hidden}#status{position:fixed;inset:0;display:grid;place-items:center;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#607083}#app.ready{visibility:visible}#status[hidden]{display:none}</style>
</head><body><div id="status">正在打开翻译工作台…</div>
<iframe id="app" src="/atelier-core.html" title="Translator Workplace · Atelier" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
 const app=document.getElementById('app'),status=document.getElementById('status');
 app.addEventListener('load',()=>{
   try{
     const d=app.contentDocument;
     if(!d)throw new Error('无法读取工作台');
     const packed=d.getElementById('week8-packed');
     const paramFrame=d.getElementById('paramFrame');
     if(paramFrame&&packed){
       const source=d.querySelector('[data-step="source"]');
       if(source)source.click();
     }
   }catch(e){status.textContent='工作台初始化失败，请刷新页面：'+e.message;return;}
   // Apply focused review refinements inside the existing same-origin workbench.
   // The original editing engine, storage, and AI workflows remain unchanged.
   if(!d.getElementById('tw-review-loader')){
     const patch=d.createElement('script');
     patch.id='tw-review-loader';
     patch.src='/atelier-review-enhancements.js';
     patch.onerror=()=>console.warn('Review enhancement unavailable; original editor remains operational.');
     d.head.appendChild(patch);
   }
   app.classList.add('ready');status.hidden=true;
 });
})();
</script></body></html>
