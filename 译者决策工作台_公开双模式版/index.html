'use strict';

  if(!d.getElementById('th-draft-layout-style')){

   d.head.appendChild(sheet);

  if(!d.getElementById('th-draft-layout-loader')){
   const draftLayout=d.createElement('script');
   draftLayout.id='th-draft-layout-loader';

   d.head.appendChild(draftLayout);

  if(!d.getElementById('transhelper-quick-actions-style')){
   const sheet=d.createElement('link');
   sheet.id='transhelper-quick-actions-style';
   sheet.rel='stylesheet';sheet.href='/transhelper-quick-actions.css?v=3';
   sheet.onerror=()=>console.warn('Quick actions theme unavailable.');
   d.head.appendChild(sheet);
  }
  if(!d.getElementById('transhelper-quick-actions-loader')){
   const quick=d.createElement('script');
   quick.id='transhelper-quick-actions-loader';
   quick.src='/transhelper-quick-actions.js?v=2';
   quick.onerror=()=>console.warn('Quick actions unavailable; original AI and backup controls remain accessible.');
   d.head.appendChild(quick);
  }
  if(!d.getElementById('transhelper-export-scope-style')){
   const sheet=d.createElement('link');
   sheet.id='transhelper-export-scope-style';
   sheet.rel='stylesheet';sheet.href='/transhelper-export-scope.css?v=1';
   sheet.onerror=()=>console.warn('Export scope styling unavailable.');
   d.head.appendChild(sheet);
  }
  if(!d.getElementById('transhelper-export-scope-loader')){
   const scope=d.createElement('script');
   scope.id='transhelper-export-scope-loader';
   scope.src='/transhelper-export-scope.js?v=1';
   scope.onerror=()=>console.warn('Optional export scope chooser unavailable; native exports remain accessible.');
   d.head.appendChild(scope);
  }
  // Visual-only header bridge. Never replaces native controls or their listeners.
  // Preserve native OCR behavior while reusing an existing blank parameter project.
  if(!d.getElementById('th-ocr-project-guard-loader')){
   const guard=d.createElement('script');
   guard.id='th-ocr-project-guard-loader';
   guard.src='/transhelper-ocr-project-guard.js?v=1';
   guard.onerror=()=>console.warn('OCR project reuse guard unavailable; original OCR remains operational.');
   d.head.appendChild(guard);
  }
  if(!d.getElementById('th-ai-provider-label-loader')){
   const provider=d.createElement('script');
   provider.id='th-ai-provider-label-loader';
   provider.src='/transhelper-ai-provider-label.js?v=1';
   provider.onerror=()=>console.warn('AI provider label unavailable.');
   d.head.appendChild(provider);
  }
  if(!d.getElementById('th-project-settings-style')){
   const sheet=d.createElement('link');
   sheet.id='th-project-settings-style';sheet.rel='stylesheet';
   sheet.href='/transhelper-project-settings.css?v=3';
   sheet.onerror=()=>console.warn('Project settings presentation styles unavailable.');
   d.head.appendChild(sheet);
  }
  if(!d.getElementById('th-project-settings-loader')){
   const settings=d.createElement('script');
   settings.id='th-project-settings-loader';
   settings.src='/transhelper-project-settings.js?v=3';
   settings.onerror=()=>console.warn('Project settings presentation enhancement unavailable.');
   d.head.appendChild(settings);
  }
  // Presentation-only navigation swap; native workflow buttons stay intact.
  if(!d.getElementById('th-navigation-swap-style')){
   const sheet=d.createElement('link');
   sheet.id='th-navigation-swap-style';sheet.rel='stylesheet';
   sheet.href='/transhelper-navigation-swap.css?v=1';
   sheet.onerror=()=>console.warn('Navigation swap style unavailable; original layout remains usable.');
   d.head.appendChild(sheet);
  }
  if(!d.getElementById('th-navigation-swap-loader')){
   const layout=d.createElement('script');
   layout.id='th-navigation-swap-loader';
   layout.src='/transhelper-navigation-swap.js?v=1';

   d.head.appendChild(layout);

  }
  if(!d.getElementById('th-sidebar-context-loader')){
   const script=d.createElement('script');
   script.id='th-sidebar-context-loader';
   script.src='/transhelper-sidebar-context.js?v=2';
   script.onerror=()=>console.warn('Sidebar context enhancement unavailable.');
   d.head.appendChild(script);
  }
  // Last, isolated visual polish. No listeners or state changes.
  if(!d.getElementById('th-experience-style')){
   const visual=d.createElement('link');
   visual.id='th-experience-style';visual.rel='stylesheet';
   visual.href='/transhelper-experience.css?v=3';
   d.head.appendChild(visual);
  }
  if(!d.getElementById('tw-week8-safety-loader')){
   const enhancement=d.createElement('script');
   enhancement.id='tw-week8-safety-loader';
   enhancement.src='/week8-review-safety.js';
   enhancement.onerror=()=>console.warn('Week8 review enhancements unavailable.');
   d.head.appendChild(enhancement);
  }
 }catch(e){console.warn('Atelier enhancement unavailable:',e);}
 const started=Date.now();
 (function reveal(){
  let doc;try{doc=app.contentDocument}catch(_){}
  if(doc?.body?.classList.contains('th-navigation-swapped')){
   app.style.visibility='visible';
   status.hidden=true;status.style.display='none';
   return;
  }
  if(Date.now()-started>6500){
   message.textContent='工作台界面未完成初始化。请刷新重试，或点击下方链接直接进入。';
   status.style.display='grid';return;
  }
  setTimeout(reveal,60);
 })();
}
app.addEventListener('load',show);
app.addEventListener('error',()=>{
 message.textContent='页面加载失败，请点击下方链接直接进入工作台。';
 status.style.display='grid';
});

// Outer-frame observer: independent of internal workspace lexical variables.
(function(){
'use strict';
const seen=new WeakSet();
const urls=new WeakMap();
let lastFile=null;
function chooseVideo(doc){
 const videos=Array.from(doc.querySelectorAll('video'));
 return videos.sort((a,b)=>((b.clientWidth||b.width||0)*(b.clientHeight||b.height||0))-((a.clientWidth||a.width||0)*(a.clientHeight||a.height||0)))[0];
}
function prepare(doc){
 if(seen.has(doc))return;
 const picker=doc.querySelector('#media-file');
 const video=chooseVideo(doc);
 if(!picker||!video)return;
 seen.add(doc);

 // Replace oversized native Safari video chrome only in the embedded editor.
 const bar=doc.createElement('div');
 bar.id='th-compact-player-controls';
 const css=doc.createElement('style');css.id='th-compact-player-style';
 css.textContent=[
 '#player-crop{position:relative!important;overflow:hidden!important;min-width:0}',
 '#player-crop #player{display:block!important;width:100%!important;height:auto!important;max-height:380px!important;min-height:0!important;aspect-ratio:16/9!important;object-fit:contain!important}',
 '#th-compact-player-controls{position:absolute;bottom:9px;left:12px;right:12px;z-index:12;display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 11px;border-radius:12px;background:rgba(15,29,40,.78);color:#fff;box-sizing:border-box;backdrop-filter:blur(12px);font:13px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}',
 '#th-compact-player-controls button{color:#fff;background:transparent;border:0;border-radius:7px;font:inherit;min-height:30px;min-width:30px;padding:3px 5px;cursor:pointer;white-space:nowrap}',
 '#th-compact-player-controls button:hover,#th-compact-player-controls button:focus-visible{background:rgba(255,255,255,.17)}',
 '#th-compact-player-controls input[type=range]{width:auto;flex:1 1 50px;min-width:30px;max-width:100%;margin:0;accent-color:#fff;height:18px;padding:0}',
 '#th-compact-player-controls .th-volume{flex:0 1 66px;max-width:66px}',
 '#th-compact-player-controls .th-time{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}',
 '@media(max-width:560px){#th-compact-player-controls{gap:5px;left:5px;right:5px;padding:4px 6px}#th-compact-player-controls .th-volume{display:none}}',
 '.embedded .desk{min-width:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}',
 '.embedded .desk > .panel{min-width:0;overflow:hidden}',
 '.embedded .panelhead{min-width:0;flex-wrap:wrap}',
 '.embedded #media-info{overflow-wrap:anywhere;font-size:13px}',
 '.embedded .video-workflow{min-width:0}',
 '@media(max-width:1050px){.embedded .desk{grid-template-columns:minmax(0,1fr)}}'
 ].join('\n');
 doc.head.appendChild(css);
 bar.innerHTML='<button type="button" class="th-play" aria-label="播放或暂停">▶</button><span class="th-time">00:00</span><input class="th-progress" type="range" min="0" max="1000" value="0" aria-label="视频播放位置"><span class="th-time th-total">00:00</span><button type="button" class="th-mute" aria-label="静音">◖))</button><input class="th-volume" type="range" min="0" max="1" step=".05" value="1" aria-label="音量"><button type="button" class="th-fullscreen" aria-label="全屏">⛶</button>';
 const area=doc.querySelector('#player-crop')||video.parentElement;
 area.appendChild(bar);
 video.controls=false;video.removeAttribute('controls');
 const play=bar.querySelector('.th-play'),progress=bar.querySelector('.th-progress'),elapsed=bar.querySelector('.th-time'),total=bar.querySelector('.th-total'),mute=bar.querySelector('.th-mute'),volume=bar.querySelector('.th-volume'),fullscreen=bar.querySelector('.th-fullscreen');
 const fmt=n=>{if(!Number.isFinite(n)||n<0)return '00:00';const s=Math.floor(n);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
 const update=()=>{
  play.textContent=video.paused?'▶':'❚❚';
  elapsed.textContent=fmt(video.currentTime);total.textContent=fmt(video.duration);
  if(!progress.matches(':active'))progress.value=Number.isFinite(video.duration)&&video.duration>0?Math.round(video.currentTime/video.duration*1000):0;
  mute.textContent=video.muted||video.volume===0?'◖×':'◖))';
  volume.value=video.muted?0:video.volume;
 };
 play.onclick=()=>{if(video.paused)video.play().catch(()=>{});else video.pause();};
 progress.oninput=()=>{if(Number.isFinite(video.duration)&&video.duration>0)video.currentTime=video.duration*Number(progress.value)/1000;};
 mute.onclick=()=>{video.muted=!video.muted;update();};
 volume.oninput=()=>{video.volume=Number(volume.value);video.muted=video.volume===0;update();};
 fullscreen.onclick=()=>{if(doc.fullscreenElement)doc.exitFullscreen?.();else area.requestFullscreen?.();};
 video.addEventListener('click',()=>{if(video.paused)video.play().catch(()=>{});else video.pause();});
 for(const type of ['timeupdate','durationchange','loadedmetadata','play','pause','volumechange','emptied'])video.addEventListener(type,update);
 update();

 const status=doc.createElement('div');
 status.id='th-playback-status';
 status.style.cssText='display:none;background:#fff2e5;color:#8b3d16;padding:10px 12px;margin:8px;border-radius:9px;font:13px/1.5 -apple-system,BlinkMacSystemFont,PingFang SC,sans-serif';
 status.setAttribute('role','status');
 (video.parentElement||doc.body).appendChild(status);
 const warn=msg=>{status.textContent=msg;status.style.display=msg?'block':'none';};
 const current=()=>chooseVideo(doc)||video;
 function diagnose(v){
  const code=v.error?.code;
  if(code===3||code===4)return '当前浏览器无法解码该文件。请检查编码格式：建议 H.264 视频及 AAC 音频的 MP4。';
  return '视频文件未成功连接播放器。请点击「打开媒体」重新选择原视频。';
 }
 let serial=0;
 // Bind the selected local File automatically. No manual relink is required.
 picker.addEventListener('change',()=>{
  const file=picker.files?.[0];
  if(!file||(!file.type.startsWith('video/')&&!file.type.startsWith('audio/')))return;
  lastFile=file;
  const ticket=++serial;
  warn('');
  const connect=()=>{
   if(ticket!==serial)return;
   const v=current();
   if(!v)return;
   if(v.readyState>=2&&Number.isFinite(v.duration)&&v.duration>0){warn('');return;}
   const existing=urls.get(v);
   if(existing&&v.src===existing&&v.networkState!==3)return;
   if(existing){try{doc.defaultView.URL.revokeObjectURL(existing)}catch(_){}}
   const blob=doc.defaultView.URL.createObjectURL(file);
   urls.set(v,blob);
   v.pause();v.src=blob;v.preload='auto';v.muted=false;v.volume=1;v.load();
  };
  // Let the editor commit its text/metadata, then attach the same File directly
  // to the actual visible player. A later pass catches late DOM/player replacement.
  doc.defaultView.setTimeout(connect,0);
  doc.defaultView.setTimeout(connect,400);
  doc.defaultView.setTimeout(()=>{
   if(ticket!==serial)return;
   const v=current();
   if(v&&v.readyState>=1&&Number.isFinite(v.duration)&&v.duration>0){warn('');return;}
   connect();
   doc.defaultView.setTimeout(()=>{
    if(ticket!==serial)return;
    const now=current();
    if(now&&now.readyState>=1&&Number.isFinite(now.duration)&&now.duration>0)warn('');
    else warn(diagnose(now||video));
   },3500);
  },1200);
 },true);
 doc.addEventListener('loadedmetadata',e=>{if(e.target.tagName==='VIDEO'&&Number.isFinite(e.target.duration)&&e.target.duration>0)warn('');},true);
 doc.addEventListener('error',e=>{if(e.target.tagName==='VIDEO')warn(diagnose(e.target));},true);
 // Keep the existing file picker for restored projects with no browser File handle.
 // Put destructive cleanup in the subtitle editor's quick actions, not the player.

<script>
/* Isolated subtitle route: only intercept subtitle launch, leave translation workflow intact. */
(function(){
 const URL='/subtitle-editor.html';
 function install(doc){
  if(!doc||doc.__thSubtitleRouteInstalled)return;
  doc.__thSubtitleRouteInstalled=true;
  doc.addEventListener('click',function(e){
   const btn=e.target.closest&&e.target.closest('#openSubtitleProject,#importVideo,[data-open-subtitle-editor]');
   if(!btn)return;
   e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
   window.location.assign(URL);
  },true);
 }
 function reconcileEntry(doc){
  // Reuse the original media-import control: it inherits the exact styling of
  // the TXT/Word and OCR buttons. Do not introduce an extra styled button.
  const video=doc.getElementById('importVideo');
  const native=doc.getElementById('openSubtitleProject');
  const redundant=doc.getElementById('th-standalone-subtitle-link');
  if(redundant)redundant.remove();
  if(video){
   video.style.removeProperty('display');
   video.style.removeProperty('visibility');
   video.removeAttribute('aria-hidden');
   video.removeAttribute('tabindex');
   if(video.textContent.trim()!=='导入视频')video.textContent='导入视频';
   if(video.title!=='进入字幕编辑器，导入视频或音频')video.title='进入字幕编辑器，导入视频或音频';
  }
  if(native&&native!==video){
   native.style.setProperty('display','none','important');
   native.setAttribute('aria-hidden','true');
   native.tabIndex=-1;
  }
 }
 function walk(doc,depth){
  if(!doc||depth>4)return;install(doc);reconcileEntry(doc);
  for(const frame of doc.querySelectorAll('iframe')){try{if(frame.contentDocument)walk(frame.contentDocument,depth+1)}catch(_){}}
 }
 setInterval(()=>{try{walk(document,0)}catch(_){}},600);
})();
</script>
